# Smoke-test GRPO recipe — same as config_pw_1gpu_smoke.yaml, but generates with transformers continuous
# batching (`generate_batch` with a paged KV cache) instead of vLLM. Requires transformers>=5.19, TRL>=1.16.
# Not meant to produce a good model: tiny step count, short completions, one data split.

# Script config
dataset_name: "data/wiki-v1-easy-depth_20_size_25"
split_list: ["depth_20_size_25_seed_11"]
from_local: true
eval_dataset_name: "data/wiki-v1-easy-depth_20_size_25"
eval_split_list: ["depth_20_size_25_seed_2"]
eval_from_local: true
reward_func_names: ["f1"]
data_curriculum: "random"
prompt_method: "cot"

# Model arguments
model_name_or_path: "Qwen/Qwen3-0.6B"
bf16: true
dtype: bfloat16
attn_implementation: "flash_attention_2" # used for both training and continuous batching
gradient_checkpointing: true

# Trainer arguments
max_steps: 10 # overrides num_train_epochs; just enough to confirm the loop runs
per_device_train_batch_size: 4
gradient_accumulation_steps: 1
use_vllm: false
use_transformers_continuous_batching: true
transformers_continuous_batching_config:
  # KV cache size in 256-token pages. Left unset, it takes most of the free GPU memory.
  # 256 pages = 65,536 tokens (~7.5GB for Qwen3-0.6B), matching the vLLM smoke recipe's budget
  # (vllm_gpu_memory_utilization 0.30 of 24GB).
  num_blocks: 256
  # torch.compile the decode path (fuses RMSNorm etc.); FlashAttention itself stays uncompiled
  # (compile_exclude_flash_attn, on by default)
  default_compile_level: 1
  # Async batching (on by default with CUDA graphs + FlashAttention) schedules the next batch before the
  # current one registers its blocks, so the num_generations copies of a prompt never share their prefix
  use_async_batching: false
  # A smaller token budget spreads the copies of a prompt over more batches, so later copies reuse the
  # prefix blocks of earlier ones (4 copies of a ~5k-token prompt: ~6.4k prefill tokens instead of ~20.5k)
  max_batch_tokens: 2048
# Keep the manager (paged cache, CUDA graphs, warmup) across steps instead of rebuilding it every step (~3 s)
cb_persistent_manager: true
generation_kwargs: {}

# max_prompt_length: 6000
num_generations: 4 # Should divide per_device_train_batch_size * number of GPUs.
max_completion_length: 1024 # shorter than the real recipe (4096) to keep the smoke test fast

# Logging config
log_level: "info"
logging_strategy: "steps"
logging_first_step: true
logging_steps: 1
save_strategy: "no" # don't write checkpoints for a throwaway run
log_completions: true
num_completions_to_print: 2 # print a couple of completions so you can see it working
eval_strategy: "no"
