[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phantom-reasoner"
description = "Phantom Reasoner"
version = "0.0.0"
authors = [
    {name="Anmol Kabra", email="anmol@cs.cornell.edu"},
    {name="Yilun Yin", email="yy958@cornell.edu"},
    {name="Albert Gong", email="agong@cs.cornell.edu"},
    {name="Kamilė Stankevičiūtė", email="ks2448@cornell.edu"},
    {name="Johann Lee", email="jcl354@cornell.edu"},
    {name="Katie Luo", email="katieluo@stanford.edu"},
]


readme = "README.md"
requires-python = "==3.12.*"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    "torch==2.9.0", # newest torch with a prebuilt flash-attn wheel (flash-attn 2.8.3)
    "deepspeed",
    "trl==1.16.0", # first release with `use_transformers_continuous_batching`
    "transformers==5.20.2", # sdpa/flash attention handle the paged KV cache directly since 5.19
    "accelerate",
    "datasets",
    "peft",
    "huggingface_hub", # 1.x+ ships the `hf` CLI; the [cli] extra was removed
    "lighteval[math]",
    "wandb",
    "ujson", # needed for HotPotQA evaluation
    "reasoning_gym==0.1.24",
    "phantom-wiki[eval]>=1.0.3",
    "langchain<1.0", # phantom_eval imports langchain.prompts, removed in langchain 1.0
]

[project.optional-dependencies]
dev = [
    "pre-commit",
    "black",
]

[project.urls]
Homepage = "https://github.com/kilian-group/phantom-reasoning"
Issues = "https://github.com/kilian-group/phantom-reasoning/issues"
Repository = "https://github.com/kilian-group/phantom-reasoning.git"

[tool.uv]
index-strategy = "unsafe-best-match"
# Transformers-only env: drop vLLM, which phantom-wiki[eval] still pulls in (marker never matches)
override-dependencies = ['vllm ; sys_platform == "never"']

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
